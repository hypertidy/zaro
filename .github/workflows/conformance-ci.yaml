on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

name: Zarr conformance tests

jobs:
  conformance-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # tabularberg (Suggests) is not needed here; left out of the solve so
      # it is not built from source (Rust) for nothing
      - name: Leave tabularberg out of the dependency solve
        run: sed -i '/^    tabularberg,$/d' DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.

      - uses: Bisaloo/zarr-conformance-tests@v0.0.2
        with:
          zarr-cli: Rscript inst/scripts/zaro-cli.R
