name: Gallery tests
on:
  schedule:
    - cron: '20 4 * * 2'  # Tuesday 0420 UTC
  workflow_dispatch:       # manual trigger button

jobs:
  gallery:
    runs-on: ubuntu-latest
    env:
      ZARO_GALLERY_TESTS: "YES"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      # tabularberg (Suggests) is not needed here; left out of the solve so
      # it is not built from source (Rust) for nothing
      - name: Leave tabularberg out of the dependency solve
        run: sed -i '/^    tabularberg,$/d' DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
      - run: Rscript -e 'testthat::test_local(filter = "gallery")'
