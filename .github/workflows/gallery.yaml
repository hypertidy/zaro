# Store gallery: one small read from each public store in gallery/stores.R
# (see gallery/README.md). An unreachable host is a warning; a read that
# fails is an error and fails the job. The table is in the run summary.
on:
  schedule:
    - cron: '20 4 * * 2'  # Tuesday 0420 UTC
  workflow_dispatch:       # manual trigger button
  pull_request:            # a change to the gallery itself
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery.yaml'

name: Store gallery

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # altarr (Suggests) is on hypertidy.r-universe.dev, not CRAN
      - uses: r-lib/actions/setup-r@v2
        with:
          extra-repositories: https://hypertidy.r-universe.dev

      # tabularberg (Suggests) is not needed here; left out of the solve so
      # it is not built from source (Rust) for nothing
      - name: Leave tabularberg out of the dependency solve
        run: sed -i '/^    tabularberg,$/d' DESCRIPTION

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: local::.

      - name: Read from each store
        run: Rscript gallery/run.R
